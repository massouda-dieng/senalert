<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SenAlert — Application Mobile Citoyenne Sénégal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    :root {
      --primary: #E63946;
      --primary-dark: #C1121F;
      --bg-dark: #0B0F19;
      --bg-app: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --accent-green: #06D6A0;
      --accent-orange: #FFB703;
      --accent-blue: #118AB2;
      --radius-md: 14px;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background: #090D16;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* SMARTPHONE CONTAINER FRAME */
    .phone-container {
      width: 100%;
      max-width: 410px;
      height: 840px;
      background: var(--bg-app);
      border-radius: 44px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 12px #1E293B, 0 0 0 14px #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* PHONE NOTCH & HEADER */
    .phone-header {
      background: var(--primary);
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
      z-index: 10;
    }
    .phone-header h2 { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }

    /* CONTENT BODY */
    .app-screen {
      flex: 1;
      overflow-y: auto;
      display: none;
      padding: 20px;
      flex-direction: column;
    }
    .app-screen.active { display: flex; }

    /* SCREEN 1: SPLASH / WELCOME */
    .splash-view {
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      background: white;
    }
    .splash-logo {
      width: 110px; height: 110px; border-radius: 28px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      font-size: 54px; color: white;
      box-shadow: 0 10px 25px rgba(230, 57, 70, 0.4);
      margin-bottom: 24px;
    }

    /* BOTTOM NAV BAR */
    .bottom-nav {
      height: 65px;
      background: white;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 20;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
    }
    .nav-btn.active { color: var(--primary); }
    .nav-btn .icon { font-size: 20px; }

    /* UI CARDS & INPUTS */
    .card-item {
      background: white;
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    .form-control {
      width: 100%; padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px; font-size: 13.5px;
      outline: none; margin-bottom: 14px;
    }
    .btn-action {
      width: 100%; padding: 14px;
      background: var(--primary); color: white;
      border: none; border-radius: 10px;
      font-weight: 700; font-size: 14px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(230, 57, 70, 0.35);
    }
    
    #mobileMap { height: 260px; border-radius: 12px; margin-bottom: 16px; width: 100%; }

    .status-pill {
      padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; text-transform: uppercase;
    }
    .pill-nouveau { background: rgba(255, 183, 3, 0.15); color: #D97706; }
    .pill-en_cours { background: rgba(17, 138, 178, 0.15); color: #0284C7; }
    .pill-resolu { background: rgba(6, 214, 160, 0.15); color: #059669; }
  </style>
</head>
<body>

  <div class="phone-container">
    <!-- APP HEADER -->
    <header class="phone-header">
      <h2>🔔 SenAlert Mobile</h2>
      <span style="font-size: 11px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px;">Sénégal</span>
    </header>

    <!-- SCREEN: ACCUEIL -->
    <section id="scr-home" class="app-screen active">
      <div class="card-item" style="background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white;">
        <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 6px;">Signaler une Urgence</h3>
        <p style="font-size: 12.5px; opacity: 0.9; margin-bottom: 16px;">Alertez les Sapeurs-Pompiers, Police, SAMU et SENELEC en 1 clic.</p>
        <button class="btn-action" style="background: white; color: var(--primary);" onclick="showScreen('report')">
          🚨 NOUVELLE ALERTE URGENCE
        </button>
      </div>

      <h4 style="font-size: 14px; font-weight: 800; margin-bottom: 12px;">🗺️ Urgences Récentes au Sénégal</h4>
      <div id="mobileMap"></div>

      <div id="homeRecentFeed"></div>
    </section>

    <!-- SCREEN: SIGNALEMENT -->
    <section id="scr-report" class="app-screen">
      <h3 style="font-size: 17px; font-weight: 800; margin-bottom: 16px;">🚨 Déclaration d'Alerte Urgente</h3>
      
      <div class="card-item">
        <label style="font-size: 12px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px;">TYPE D'INCIDENT</label>
        <select id="mReportType" class="form-control">
          <option value="accident">🚗 Accident de circulation</option>
          <option value="incendie">🔥 Incendie / Feu</option>
          <option value="inondation">🌊 Inondation / Fortes pluies</option>
          <option value="electricite">⚡ Coupure Électricité SENELEC</option>
          <option value="insecurite">🚨 Insécurité / Urgence</option>
        </select>

        <label style="font-size: 12px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px;">RÉGION DU SÉNÉGAL</label>
        <select id="mReportRegion" class="form-control">
          <option value="dakar">Dakar</option>
          <option value="thies">Thiès</option>
          <option value="saint_louis">Saint-Louis</option>
          <option value="kaolack">Kaolack</option>
          <option value="ziguinchor">Ziguinchor</option>
          <option value="tambacounda">Tambacounda</option>
        </select>

        <label style="font-size: 12px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px;">DESCRIPTION DÉTAILLÉE</label>
        <textarea id="mReportDesc" class="form-control" rows="3" placeholder="Description du problème..."></textarea>

        <button class="btn-action" onclick="submitMobileReport()">
          🚀 Transmettre le Signalement au PC
        </button>
      </div>
    </section>

    <!-- SCREEN: LISTE INCIDENTS -->
    <section id="scr-incidents" class="app-screen">
      <h3 style="font-size: 17px; font-weight: 800; margin-bottom: 16px;">📋 Liste des Incidents</h3>
      <div id="incidentsListContainer"></div>
    </section>

    <!-- SCREEN: PROFIL -->
    <section id="scr-profile" class="app-screen">
      <div class="card-item" style="text-align: center; padding: 24px;">
        <div style="width: 70px; height: 70px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 12px;">
          👤
        </div>
        <h3 style="font-size: 16px; font-weight: 800;" id="mProfileUser">Citoyen Sénégalais</h3>
        <p style="font-size: 12px; color: var(--text-muted);">Compte Citoyen Actif</p>
      </div>
    </section>

    <!-- BOTTOM NAVBAR -->
    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="showScreen('home')">
        <span class="icon">🏠</span>
        <span>Accueil</span>
      </button>
      <button class="nav-btn" onclick="showScreen('report')">
        <span class="icon">🚨</span>
        <span>Signaler</span>
      </button>
      <button class="nav-btn" onclick="showScreen('incidents')">
        <span class="icon">📋</span>
        <span>Incidents</span>
      </button>
      <button class="nav-btn" onclick="showScreen('profile')">
        <span class="icon">👤</span>
        <span>Profil</span>
      </button>
    </nav>
  </div>

  <script>
    let API_BASE = 'http://127.0.0.1:8000/api';
    let mobileMap = null;
    let mobileIncidents = [
      { id: 101, type_incident: 'accident', description: 'Carambolage Autoroute Pikine', region: 'dakar', statut: 'nouveau', lat: 14.7500, lng: -17.3900 },
      { id: 102, type_incident: 'incendie', description: 'Feu au marché HLM', region: 'dakar', statut: 'en_cours', lat: 14.7200, lng: -17.4600 },
      { id: 103, type_incident: 'inondation', description: 'Inondation Quai Saint-Louis', region: 'saint_louis', statut: 'nouveau', lat: 16.0179, lng: -16.4897 }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      initMobileMap();
      fetchMobileIncidents();
    });

    function initMobileMap() {
      if (mobileMap) return;
      mobileMap = L.map('mobileMap').setView([14.4974, -14.4524], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mobileMap);
    }

    async function fetchMobileIncidents() {
      try {
        const res = await fetch(`${API_BASE}/incidents/`);
        if (res.ok) {
          mobileIncidents = await res.json();
        }
      } catch(e) {}
      renderMobileData();
    }

    function renderMobileData() {
      // Map markers
      if (mobileMap) {
        mobileIncidents.forEach(i => {
          if (i.latitude && i.longitude) {
            L.circleMarker([i.latitude, i.longitude], { radius: 8, fillColor: '#E63946', color: '#fff', weight: 2, fillOpacity: 0.9 })
             .addTo(mobileMap)
             .bindPopup(`<b>${i.type_incident}</b><br>📍 ${i.region}`);
          }
        });
      }

      // Recent feed
      const feed = document.getElementById('homeRecentFeed');
      feed.innerHTML = '';
      mobileIncidents.slice(0, 3).forEach(i => {
        feed.innerHTML += `
          <div class="card-item" style="display:flex; align-items:center; gap:12px;">
            <span style="font-size:24px;">🚨</span>
            <div style="flex:1;">
              <strong style="font-size:13.5px;">${i.type_incident.toUpperCase()}</strong>
              <p style="font-size:11.5px; color:var(--text-muted);">📍 ${i.region.toUpperCase()} — ${i.description}</p>
            </div>
            <span class="status-pill pill-${i.statut}">${i.statut}</span>
          </div>
        `;
      });

      // Full List
      const list = document.getElementById('incidentsListContainer');
      list.innerHTML = '';
      mobileIncidents.forEach(i => {
        list.innerHTML += `
          <div class="card-item">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <strong style="font-size:14px;">#INC-${i.id} — ${i.type_incident.toUpperCase()}</strong>
              <span class="status-pill pill-${i.statut}">${i.statut}</span>
            </div>
            <p style="font-size:12.5px; color:var(--text-muted);">📍 Région: ${i.region.toUpperCase()}</p>
            <p style="font-size:13px; margin-top:6px;">${i.description}</p>
          </div>
        `;
      });
    }

    function showScreen(screenId) {
      document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`scr-${screenId}`).classList.add('active');

      if (screenId === 'home' && mobileMap) {
        setTimeout(() => mobileMap.invalidateSize(), 200);
      }
    }

    async function submitMobileReport() {
      const type = document.getElementById('mReportType').value;
      const region = document.getElementById('mReportRegion').value;
      const desc = document.getElementById('mReportDesc').value.trim();

      if (!desc) { alert('Veuillez fournir une description de l urgence'); return; }

      const newInc = {
        id: Math.floor(Math.random() * 8000) + 1000,
        type_incident: type,
        region: region,
        description: desc,
        statut: 'nouveau',
        latitude: 14.6928,
        longitude: -17.4467
      };

      mobileIncidents.unshift(newInc);
      alert('Alerte transmise au Centre de Commandement SenAlert !');
      showScreen('home');
      renderMobileData();
    }
  </script>
</body>
</html>
