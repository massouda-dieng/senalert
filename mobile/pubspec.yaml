name: senalert_mobile
description: "SenAlert Mobile App for Senegal emergency alerts."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  geolocator: ^13.0.0
  http: ^1.2.2
  shared_preferences: ^2.3.0
  fluttertoast: ^8.2.8
  provider: ^6.1.2
  intl: ^0.19.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  go_router: ^14.2.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  pretty_dio_logger: ^1.4.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/