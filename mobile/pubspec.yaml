name: senalert_mobile
description: "SenAlert — signalement et suivi des urgences au Sénégal (citoyens et agents)."

publish_to: 'none'

version: 3.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Navigation, état
  go_router: ^14.2.0
  provider: ^6.1.2
  # Réseau et stockage sécurisé
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0
  uuid: ^4.5.1
  # Carte et localisation
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.0
  # Médias, liens, interface
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  # Assistant vocal : dictée (micro, transcrite par le serveur) et lecture des réponses à voix haute.
  # record 6.0.0 exactement : à partir de 6.1, record_android lit flutter.compileSdkVersion, que Flutter 3.24 ne fournit pas aux modules (l’APK ne compile plus).
  record: 6.0.0
  # Versions de la même époque que record 6.0.0 (compileSdk fixe, compatible Flutter 3.24).
  record_android: 1.3.3
  flutter_tts: ^4.2.0
  # Authentification Google (ID token vérifié par le backend)
  google_sign_in: ^6.2.1
  # Notifications push
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/photos/
    - assets/data/
    - assets/traductions/

# geolocator_android 4.6.2 exige un Flutter plus récent que 3.24 pour compiler sous Android.
dependency_overrides:
  geolocator_android: 4.6.1
