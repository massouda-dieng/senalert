          type: string
          readOnly: true
        gravite:
          $ref: '#/components/schemas/GraviteEnum'
        service:
          type: integer
          nullable: true
        service_nom:
          type: string
          readOnly: true
        date_creation:
          type: string
          format: date-time
        date_modification:
          type: string
          format: date-time
          readOnly: true
        date_prise_en_charge:
          type: string
          format: date-time
          nullable: true
        date_cloture:
          type: string
          format: date-time
          nullable: true
        motif_cloture:
          type: string
          maxLength: 255
        en_retard:
