          - $ref: '#/components/schemas/SourcePositionEnum'
          - $ref: '#/components/schemas/BlankEnum'
        region:
          oneOf:
          - $ref: '#/components/schemas/RegionEnum'
          - $ref: '#/components/schemas/BlankEnum'
        region_libelle:
          type: string
          readOnly: true
        adresse:
          type: string
