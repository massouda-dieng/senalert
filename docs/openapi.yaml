        * Agent : voit les dossiers qui lui sont affectés et les nouveaux dossiers de son service dans ses zones.
        * Superadministrateur : voit et gère tout.
      parameters:
      - in: query
        name: actifs
        schema:
          type: boolean
      - in: query
        name: affecte_a_moi
        schema:
          type: boolean
      - in: query
        name: agent
        schema:
          type: number
      - in: query
        name: date_debut
        schema:
          type: string
          format: date
      - in: query
        name: date_fin
        schema:
          type: string
          format: date
      - in: query
        name: doublons
        schema:
          type: boolean
      - in: query
        name: gravite
        schema:
          type: array
          items:
            type: string
            enum:
            - critique
            - elevee
            - faible
            - moyenne
        description: |-
          * `faible` - Faible
          * `moyenne` - Moyenne
          * `elevee` - Élevée
          * `critique` - Critique
        explode: true
        style: form
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: region
        schema:
          type: array
          items:
            type: string
            enum:
            - dakar
            - diourbel
            - fatick
            - kaffrine
            - kaolack
            - kedougou
            - kolda
            - louga
            - matam
            - saint_louis
            - sedhiou
            - tambacounda
            - thies
            - ziguinchor
        description: |-
          * `dakar` - Dakar
          * `thies` - Thiès
          * `saint_louis` - Saint-Louis
          * `diourbel` - Diourbel
          * `louga` - Louga
          * `fatick` - Fatick
          * `kaolack` - Kaolack
          * `kaffrine` - Kaffrine
          * `matam` - Matam
          * `tambacounda` - Tambacounda
          * `kedougou` - Kédougou
          * `kolda` - Kolda
          * `sedhiou` - Sédhiou
          * `ziguinchor` - Ziguinchor
        explode: true
        style: form
      - in: query
        name: service
        schema:
          type: number
      - in: query
        name: statut
        schema:
          type: array
          items:
            type: string
            enum:
            - accepte
            - affecte
            - annule
            - en_cours
            - nouveau
            - refuse
            - resolu
        description: |-
          * `nouveau` - Nouveau
          * `affecte` - Affecté
          * `accepte` - Accepté
          * `en_cours` - En cours
          * `resolu` - Résolu
          * `refuse` - Rejeté
          * `annule` - Annulé
        explode: true
        style: form
      - name: taille
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: type_incident
        schema:
          type: array
          items:
            type: string
        explode: true
        style: form
      tags:
      - incidents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIncidentList'
          description: ''
