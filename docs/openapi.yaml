          maxLength: 40
        fonction:
          type: string
          maxLength: 80
      required:
      - service_nom
    AgentProfilRequest:
      type: object
      properties:
        service:
          type: integer
          nullable: true
        zones:
          description: Codes des régions couvertes.
        matricule:
          type: string
          maxLength: 40
        fonction:
          type: string
          maxLength: 80
    AlerteSOS:
      type: object
      description: Champs calculés communs aux incidents et SOS.
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
          nullable: true
        message:
          type: string
          maxLength: 280
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        precision_gps:
          type: number
          format: double
          nullable: true
          description: Précision horizontale en mètres.
        source_position:
